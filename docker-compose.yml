services:
  db:
    image: postgres:16-alpine
    container_name: unleash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: unleashpassword
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "unleash"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  unleash:
    image: unleashorg/unleash-server:8.3.1
    container_name: unleash-server
    restart: unless-stopped
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: "postgres://postgres:unleashpassword@db:5432/unleash"
      DATABASE_SSL: "false"
      LOG_LEVEL: "warn"
      # LOCAL-ONLY DEMO CREDENTIALS: Never use these in staging or production!
      # Admin token: scoped for administrative automation (bootstrap scripts, flag setup)
      INIT_ADMIN_API_TOKENS: "*:*.local-demo-admin-token-not-for-production"
      # Backend client token: scoped for Java SDK client (read toggles for default project & development environment)
      INIT_BACKEND_API_TOKENS: "default:development.local-demo-backend-token-for-java-service"
      INIT_CLIENT_API_TOKENS: "default:development.local-demo-backend-token-for-java-service"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4242/health"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
